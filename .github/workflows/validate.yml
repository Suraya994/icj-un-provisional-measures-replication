name: validate-replication
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify committed files against SHA256SUMS
        run: sha256sum -c SHA256SUMS.txt
      - run: python -m pip install -r requirements.txt
      - run: python code/reproduce_published_results.py
      - run: python code/reproduce_additional_results.py
      - run: python code/check_paper_concordance.py
      - run: python code/validate_release.py
      - run: python -m unittest discover -s tests -v
